set_to_next_free_day:
  name: "Rezept auf nächsten freien Tag setzen"
  description: "Trägt ein vorgeschlagenes Rezept in den Mealie-Speiseplan ein und schickt eine Push-Nachricht."
  fields:
    recipe_id:
      name: "Rezept-ID"
      description: "Mealie-Rezept-ID aus dem Kochvorschläge-Sensor (empfohlen)."
      required: false
      selector:
        text:
    recipe_index:
      name: "Rezept-Index"
      description: "Alternativ: Position des Rezepts im Kochvorschläge-Sensor (0 = erstes Rezept)."
      required: false
      selector:
        number:
          min: 0
          max: 500
          mode: box
    selected_date:
      name: "Datum"
      description: "Optionales Wunschdatum. Leer = nächster freier Tag."
      required: false
      selector:
        date:
    entry_type:
      name: "Mahlzeit-Typ"
      description: "Typ des Speiseplan-Eintrags."
      required: false
      default: "dinner"
      selector:
        select:
          options:
            - "breakfast"
            - "lunch"
            - "dinner"
            - "side"

add_missing_ingredients:
  name: "Fehlende Zutaten auf die Einkaufsliste setzen"
  description: "Schiebt die fehlenden Zutaten eines vorgeschlagenen Rezepts auf die konfigurierte To-do-Liste. Bereits offene Einträge werden übersprungen."
  fields:
    recipe_id:
      name: "Rezept-ID"
      description: "Mealie-Rezept-ID aus dem Kochvorschläge-Sensor (empfohlen)."
      required: false
      selector:
        text:
    recipe_index:
      name: "Rezept-Index"
      description: "Alternativ: Position des Rezepts im Kochvorschläge-Sensor (0 = erstes Rezept)."
      required: false
      selector:
        number:
          min: 0
          max: 500
          mode: box

sync_shopping_list:
  name: "Grocy-Einkaufsliste übernehmen"
  description: "Überträgt die offenen Einträge der Grocy-Einkaufsliste sofort auf die konfigurierte To-do-Liste und entfernt sie danach in Grocy (je nach Option)."

enrich_from_openfoodfacts:
  name: "Kalorien und Bilder aus Open Food Facts ergänzen"
  description: "Sucht für Grocy-Produkte mit Barcode fehlende Kalorien und Produktbilder bei Open Food Facts. Füllt nur leere Felder. Im Probelauf wird nichts geschrieben."
  fields:
    dry_run:
      name: "Probelauf"
      description: "Nur nachschlagen und berichten, nichts in Grocy schreiben."
      required: false
      default: true
      selector:
        boolean:
    limit:
      name: "Anzahl Produkte"
      description: "Höchstens so viele Produkte pro Lauf prüfen. Open Food Facts erlaubt etwa 13 Abfragen pro Minute."
      required: false
      default: 15
      selector:
        number:
          min: 1
          max: 500
          mode: box
    include_calories:
      name: "Kalorien ergänzen"
      required: false
      default: true
      selector:
        boolean:
    include_images:
      name: "Bilder ergänzen"
      required: false
      default: true
      selector:
        boolean:
